# Single free-tier Render web service: one Docker container serves the UI and /api
# on the same origin (no CORS, no cross-site cookies). No database is created.
# Applying this may incur charges if you change the plan; check Render's current terms.
services:
  - type: web
    name: rights-and-resonance
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SERVE_WEB
        value: "true"
      - key: QLOO_TRANSPORT
        value: direct-http
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      # Secret: paste in the Render dashboard. Omit it and the live Qloo gate stays UNVERIFIED.
      - key: QLOO_API_KEY
        sync: false
      # The service's own public URL, e.g. https://rights-and-resonance.onrender.com
      # (scheme + host, no path or trailing slash). Same-origin requests carry this Origin.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
# Render injects PORT. Without DATABASE_URL, state is in memory and resets on restart;
# free services also spin down when idle, so open the URL once before a demo.
